name: credential-audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTELEMETRY: "off"
  GOTOOLCHAIN: local

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full selected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Credential Auditor outside worktree
        run: go build -trimpath -o "$RUNNER_TEMP/credential-auditor" ./cmd/credential-auditor

      - name: Audit declared local Git scope
        run: |
          "$RUNNER_TEMP/credential-auditor" \
            --repo . \
            --out credential-audit.json \
            --operator-out credential-audit.txt

      # This reusable template is intentionally fail-closed: it contains no finding
      # exceptions. Any FINDINGS (exit 2) or INDETERMINATE result (exit 3) fails the
      # job unless the adopting repository deliberately designs and documents its own
      # bounded exception policy.
      # Optional: upload the redacted reports if your repository's evidence-retention
      # policy allows it. Credential Auditor never needs source content uploaded to
      # a hosted scanner.
