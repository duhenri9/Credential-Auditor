name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GOTELEMETRY: "off"
  GOTOOLCHAIN: local

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full selected history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Tool identities
        run: |
          go version
          git version
          go env GOTELEMETRY

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Build CLI outside worktree
        run: go build -trimpath -o "$RUNNER_TEMP/credential-auditor" ./cmd/credential-auditor

      - name: Prove repository pre-publication gate
        run: |
          set +e
          "$RUNNER_TEMP/credential-auditor" \
            --repo . \
            --out artifacts/self-report.json \
            --operator-out artifacts/self-report.txt
          status=$?
          set -e

          # The repository's public history intentionally contains one synthetic
          # detector fixture. The self-audit may return FINDINGS (2) only for that
          # exact bounded case; every other finding or any coverage error fails.
          test "$status" -eq 2

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/self-report.json").read_text())
          operator = Path("artifacts/self-report.txt").read_text()

          assert report["outcome"] == "FINDINGS"
          assert report["errors"] == []
          assert report["report_sha256"]
          assert report["reachable_objects"] > 0
          assert report["reachable_blobs"] > 0
          assert report["report_sha256"] in operator
          assert "PASS means only" in operator

          findings = report["findings"]
          assert findings, "expected the known synthetic historical fixture"
          expected = {
              "detector_id": "credential-auditor-fixture",
              "scope": "reachable-history",
              "path": "internal/audit/audit_test.go",
          }
          for finding in findings:
              observed = {key: finding.get(key) for key in expected}
              assert observed == expected, f"unexpected self-audit finding: {finding}"
          PY

      - name: Build integration fixture repositories
        run: |
          set -euo pipefail
          mkdir -p artifacts/repos/clean artifacts/repos/history

          for repo in artifacts/repos/clean artifacts/repos/history; do
            git -C "$repo" init -b main
            git -C "$repo" config user.email fixture@example.invalid
            git -C "$repo" config user.name "Credential Auditor Fixture"
            printf 'clean fixture\n' > "$repo/README.md"
            git -C "$repo" add README.md
            git -C "$repo" commit -m initial
          done

          prefix='CA_TEST_SECRET_'
          suffix='ABCDEFGHIJKLMNOP'
          printf 'fixture=%s%s\n' "$prefix" "$suffix" > artifacts/repos/history/historical.txt
          git -C artifacts/repos/history add historical.txt
          git -C artifacts/repos/history commit -m 'add historical fixture'
          rm artifacts/repos/history/historical.txt
          git -C artifacts/repos/history add -u
          git -C artifacts/repos/history commit -m 'remove historical fixture'

      - name: Prove clean repository control
        run: |
          "$RUNNER_TEMP/credential-auditor" \
            --repo artifacts/repos/clean \
            --out artifacts/clean-report.json \
            --operator-out artifacts/clean-report.txt

      - name: Prove historical-only finding control
        run: |
          set +e
          "$RUNNER_TEMP/credential-auditor" \
            --repo artifacts/repos/history \
            --out artifacts/history-report.json \
            --operator-out artifacts/history-report.txt
          status=$?
          set -e
          test "$status" -eq 2

      - name: Prove incomplete-scope indeterminate control
        run: |
          nonrepo=$(mktemp -d)
          set +e
          "$RUNNER_TEMP/credential-auditor" \
            --repo "$nonrepo" \
            --out artifacts/indeterminate-report.json \
            --operator-out artifacts/indeterminate-report.txt
          status=$?
          set -e
          test "$status" -eq 3

      - name: Verify evidence semantics and redaction
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          clean = json.loads(Path("artifacts/clean-report.json").read_text())
          assert clean["outcome"] == "PASS"
          assert clean["reachable_objects"] > 0
          assert clean["reachable_blobs"] > 0
          assert "refs/heads/main" in clean["refs"]
          assert clean["report_sha256"] in Path("artifacts/clean-report.txt").read_text()

          history = json.loads(Path("artifacts/history-report.json").read_text())
          assert history["outcome"] == "FINDINGS"
          assert any(
              finding["scope"] == "reachable-history"
              and finding["detector_id"] == "credential-auditor-fixture"
              for finding in history["findings"]
          )
          synthetic = "CA_TEST_SECRET_" + "ABCDEFGHIJKLMNOP"
          rendered_history = json.dumps(history)
          operator_history = Path("artifacts/history-report.txt").read_text()
          assert synthetic not in rendered_history
          assert synthetic not in operator_history
          assert history["report_sha256"] in operator_history

          indeterminate = json.loads(Path("artifacts/indeterminate-report.json").read_text())
          assert indeterminate["outcome"] == "INDETERMINATE"
          assert indeterminate["errors"]
          assert indeterminate["report_sha256"] in Path(
              "artifacts/indeterminate-report.txt"
          ).read_text()
          PY

      - name: Upload redacted audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: credential-auditor-v02
          path: |
            artifacts/*-report.json
            artifacts/*-report.txt
          if-no-files-found: error
